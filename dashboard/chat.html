<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mimo Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-container {
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    .chat-header {
      padding: 16px 20px;
      background: #6366f1;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 18px;
    }

    .chat-header-info {
      flex: 1;
    }

    .chat-header-name {
      font-weight: 600;
      font-size: 16px;
    }

    .chat-header-status {
      font-size: 12px;
      opacity: 0.8;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message-user {
      align-self: flex-end;
      background: #6366f1;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message-assistant {
      align-self: flex-start;
      background: #e5e7eb;
      color: #1f2937;
      border-bottom-left-radius: 4px;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: #e5e7eb;
      border-radius: 18px;
      width: fit-content;
    }

    .typing-indicator span {
      width: 8px;
      height: 8px;
      background: #9ca3af;
      border-radius: 50%;
      animation: typing 1.4s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-4px); }
    }

    .chat-input {
      padding: 16px 20px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .chat-input textarea {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      resize: none;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.5;
      max-height: 120px;
      outline: none;
    }

    .chat-input textarea:focus {
      border-color: #6366f1;
    }

    .chat-input button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #6366f1;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .chat-input button:hover {
      background: #4f46e5;
    }

    .chat-input button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .chat-input button svg {
      width: 20px;
      height: 20px;
    }

    .welcome-message {
      text-align: center;
      color: #6b7280;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-header-avatar">M</div>
      <div class="chat-header-info">
        <div class="chat-header-name">Mimo</div>
        <div class="chat-header-status">Online</div>
      </div>
    </div>
    <div class="chat-messages" id="messages">
      <div class="welcome-message">Hello! I'm Mimo. How can I help you today?</div>
    </div>
    <div class="chat-input">
      <textarea id="messageInput" placeholder="Type a message..." rows="1"></textarea>
      <button id="sendBtn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const API_URL = window.location.origin;
    const WIDGET_SLUG = 'mimo-chat';

    let messages = [];
    let isLoading = false;

    function addMessage(role, content) {
      messages.push({ role, content, timestamp: Date.now() });
      
      const el = document.createElement('div');
      el.className = `message message-${role}`;
      el.textContent = content;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      isLoading = true;
      sendBtn.disabled = true;
      
      const el = document.createElement('div');
      el.className = 'typing-indicator';
      el.id = 'typing';
      el.innerHTML = '<span></span><span></span><span></span>';
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideTyping() {
      isLoading = false;
      sendBtn.disabled = false;
      
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isLoading) return;

      messageInput.value = '';
      messageInput.style.height = 'auto';
      addMessage('user', text);
      showTyping();

      try {
        const response = await fetch(`${API_URL}/api/public/widgets/${WIDGET_SLUG}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            visitorId: 'standalone-user',
            context: {
              pageUrl: window.location.href,
              pageTitle: document.title,
            },
            history: messages.slice(-10),
          }),
        });

        const data = await response.json();
        hideTyping();

        if (data.response) {
          addMessage('assistant', data.response);
        } else {
          addMessage('assistant', 'Sorry, something went wrong. Please try again.');
        }
      } catch (err) {
        hideTyping();
        addMessage('assistant', 'Unable to connect. Please check your connection and try again.');
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
    });

    messageInput.focus();
  </script>
</body>
</html>
