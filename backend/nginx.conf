server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # No duplicate Access-Control-Allow-Origin here: the Express app already
    # emits one (origin: '*'), so adding another produces a CORS failure
    # ("Access-Control-Allow-Origin contains multiple values").
    location /widget.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        alias /usr/share/nginx/html/widget.js;
    }
}