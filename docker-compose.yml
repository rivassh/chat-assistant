services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://jobvision:secret@ymls-pgsql-1:5432/site_assistant?schema=public
      JWT_SECRET: dev-secret-change-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4o-mini
      AI_BASE_URL: ${AI_BASE_URL:-http://mimo-adapter:8000}
      AI_MODEL: ${AI_MODEL:-mimo}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      PORT: 3001
      CORS_ORIGIN: https://cchat.adlr.ir
      TMUX_SESSION: "2"
      TMUX_WINDOW: "0"
    volumes:
      - '/opt/logs:/var/www/websites/adlr/storage/logs'
      - /tmp/tmux-1000:/tmp/tmux-1000
    networks:
      - sail

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - sail

  widget:
    build:
      context: ./widget
      dockerfile: Dockerfile
    ports:
      - "8086:80"
    depends_on:
      - backend
    networks:
      - sail

networks:
  sail:
    external: true
