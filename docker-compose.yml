services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: site_assistant
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sail

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
       DATABASE_URL: postgresql://jobvision:secret@ymls-pgsql-1:5432/site_assistant?schema=public
      JWT_SECRET: dev-secret-change-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4o-mini
      PORT: 3001
      CORS_ORIGIN: https://cchat.adlr.ir
      TMUX_SESSION: "2"
      TMUX_WINDOW: "0"
    volumes:
      - '/opt/logs:/var/www/websites/adlr/storage/logs'
      - /tmp/tmux-1000:/tmp/tmux-1000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sail

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - sail

  widget:
    build:
      context: ./widget
      dockerfile: Dockerfile
    ports:
      - "8086:80"
    depends_on:
      - backend
    networks:
      - sail

volumes:
  pgdata:

networks:
  sail:
    external: true
